<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Lakshiv OS 1</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<meta name="theme-color" content="#ffffff">
<style>
  :root{--accent:#0078d4;--tb:40px}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden;font-family:"Segoe UI",system-ui,-apple-system,sans-serif;font-size:13px;color:#1a1a1a;user-select:none;background:#0b1b3a}
  #wall{position:fixed;inset:0;width:100%;height:100%;z-index:0;display:block}
  #desktop{position:fixed;inset:0 0 var(--tb) 0;z-index:1}
  #windows{position:fixed;inset:0 0 var(--tb) 0;z-index:2;pointer-events:none}

  /* lock screen */
  #boot{position:fixed;inset:0;z-index:9999;background:rgba(5,10,25,.35);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:12vh 0 9vh;cursor:pointer;transition:opacity .4s,transform .5s}
  #boot.hide{opacity:0;pointer-events:none;transform:translateY(-24px)}
  .lk-time{font-size:min(15vw,112px);font-weight:200;line-height:1;text-align:center}
  .lk-date{font-size:22px;margin-top:8px;opacity:.92;text-align:center}
  .lk-user{text-align:center}
  .lk-av{width:96px;height:96px;border-radius:50%;background:#ffffff26;display:flex;align-items:center;justify-content:center;font-size:48px;margin:0 auto 10px}
  .lk-user small{display:block;margin-top:16px;opacity:.75}

  /* desktop icons */
  .icon{position:absolute;width:88px;padding:4px 2px 2px;text-align:center;cursor:default;border:1px solid transparent;border-radius:3px;color:#fff;text-shadow:0 1px 3px #000,0 0 2px #000}
  .icon .glyph{font-size:34px;line-height:42px}
  .icon .lbl{display:block;font-size:12px;line-height:1.25;word-break:break-word;max-height:3.75em;overflow:hidden;margin-top:2px}
  .icon:hover{background:#ffffff1f}
  .icon.sel{background:#ffffff33;border-color:#ffffff66}
  .icon.drag{opacity:.8;z-index:50}

  /* windows */
  .win{position:absolute;display:flex;flex-direction:column;background:#fff;border-radius:8px;box-shadow:0 8px 30px #0008,0 0 0 1px #0005;overflow:hidden;min-width:240px;min-height:160px;pointer-events:auto}
  .win.active{box-shadow:0 14px 44px #000b,0 0 0 1px #ffffff40}
  .win.max{border-radius:0}
  .win.min{display:none}
  .titlebar{height:34px;flex:none;display:flex;align-items:center;background:rgba(36,36,42,.98);color:#fff;cursor:default;position:relative}
  .win:not(.active) .titlebar{background:rgba(58,58,64,.98);color:#c3c3c8}
  .wicon{padding:0 8px 0 11px;font-size:15px}
  .titlebar .title{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:12.5px}
  .wbtns{display:flex;height:100%}
  .wb{width:46px;border:0;background:transparent;color:inherit;font:14px "Segoe UI",system-ui,sans-serif;cursor:default}
  .wb:hover{background:#ffffff22}
  .wb.close:hover{background:#e81123;color:#fff}
  .content{flex:1;overflow:auto;position:relative;user-select:text;min-height:0}
  .rz{position:absolute;z-index:6}
  .win.max .rz{display:none}
  .rz[data-d=n]{top:0;left:10px;right:10px;height:5px;cursor:ns-resize}
  .rz[data-d=s]{bottom:0;left:10px;right:10px;height:5px;cursor:ns-resize}
  .rz[data-d=e]{right:0;top:10px;bottom:10px;width:5px;cursor:ew-resize}
  .rz[data-d=w]{left:0;top:10px;bottom:10px;width:5px;cursor:ew-resize}
  .rz[data-d=ne]{top:0;right:0;width:12px;height:12px;cursor:nesw-resize}
  .rz[data-d=nw]{top:0;left:0;width:12px;height:12px;cursor:nwse-resize}
  .rz[data-d=se]{bottom:0;right:0;width:14px;height:14px;cursor:nwse-resize}
  .rz[data-d=sw]{bottom:0;left:0;width:12px;height:12px;cursor:nesw-resize}
  .pad{padding:14px;line-height:1.55}

  /* taskbar */
  #taskbar{position:fixed;left:0;right:0;bottom:0;height:var(--tb);background:rgba(16,16,20,.88);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);z-index:5000;display:flex;color:#fff}
  .tstart{width:48px;flex:none;display:flex;align-items:center;justify-content:center;cursor:default}
  .tstart:hover,.tstart.on{background:#ffffff1f}
  .winlogo{display:grid;grid-template-columns:1fr 1fr;gap:2px;width:16px;height:16px}
  .winlogo i{background:#4cc2ff;display:block}
  .tsearch{width:240px;flex:none;display:flex;align-items:center;gap:10px;padding:0 14px;background:#fff;color:#555;cursor:text;font-size:13px}
  #tbwins{display:flex;flex:1;min-width:0;overflow:hidden;margin-left:4px}
  .tbtn{width:46px;flex:none;display:flex;align-items:center;justify-content:center;position:relative;font-size:20px;cursor:default}
  .tbtn:hover{background:#ffffff1f}
  .tbtn.open::after{content:"";position:absolute;bottom:0;left:12px;right:12px;height:3px;background:#8a8a90}
  .tbtn.active{background:#ffffff2e}
  .tbtn.active::after{background:var(--accent);left:6px;right:6px}
  .tbtn.mini{opacity:.7}
  #tray{display:flex;align-items:center;flex:none}
  .tray-i{padding:0 7px;font-size:13px;opacity:.9}
  #clock{padding:0 10px;text-align:center;line-height:1.25;font-size:12px;cursor:default;height:100%;display:flex;flex-direction:column;justify-content:center}
  #clock:hover{background:#ffffff1f}
  #showdesk{width:9px;height:100%;border-left:1px solid #ffffff40;cursor:default}
  #showdesk:hover{background:#ffffff33}

  /* start menu + calendar */
  #startmenu{position:fixed;left:0;bottom:var(--tb);width:min(560px,100vw);height:min(620px,calc(100vh - var(--tb)));background:rgba(28,28,34,.97);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);color:#fff;z-index:5500;display:none;border:1px solid #484850;border-bottom:0}
  #startmenu.show{display:flex}
  .sm-rail{width:48px;flex:none;display:flex;flex-direction:column;justify-content:flex-end;padding-bottom:4px}
  .sm-rail button{height:46px;border:0;background:transparent;color:#fff;font-size:18px;cursor:default}
  .sm-rail button:hover{background:#ffffff1f}
  .sm-main{flex:1;min-width:0;display:flex;flex-direction:column;padding:14px 14px 0 4px}
  .sm-search{height:38px;border:1px solid #666;background:#ffffff14;color:#fff;border-radius:4px;padding:0 12px;font:inherit;font-size:14px;outline:0;margin-bottom:10px}
  .sm-search:focus{border-color:var(--accent);background:#ffffff1f}
  .sm-search::placeholder{color:#aaa}
  .sm-body{flex:1;overflow:auto;padding-bottom:12px}
  .sm-body h5{font-size:12px;font-weight:600;opacity:.75;margin:6px 4px 8px}
  .sm-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:12px}
  .sm-app{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 4px;border-radius:5px;text-align:center;font-size:12px;cursor:default}
  .sm-app:hover{background:#ffffff1c}
  .sm-app span{font-size:30px;line-height:34px}
  .sm-row{display:flex;gap:10px;align-items:center;padding:7px 8px;border-radius:5px;cursor:default}
  .sm-row:hover{background:#ffffff1c}
  .sm-row small{margin-left:auto;opacity:.6}
  #cal{position:fixed;right:0;bottom:var(--tb);width:300px;background:rgba(28,28,34,.97);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);color:#fff;border:1px solid #484850;z-index:5500;display:none;padding:14px}
  #cal.show{display:block}
  .cal-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
  .cal-h button{background:transparent;border:0;color:#fff;font-size:13px;width:32px;height:28px;cursor:pointer}
  .cal-h button:hover{background:#ffffff1f}
  .cal-g{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center}
  .cal-g div{padding:7px 0;border-radius:50%}
  .cal-g .dow{opacity:.6;font-size:11px}
  .cal-g .dim{opacity:.35}
  .cal-g .today{background:var(--accent);color:#fff}
  @media (max-width:820px){.tsearch{width:48px;padding:0;justify-content:center}.tsearch .tst{display:none}}

  /* shared app bits */
  textarea.notes{width:100%;height:100%;border:0;outline:0;resize:none;padding:12px;font:13px/1.5 "Cascadia Mono",Consolas,monospace;background:#fff;color:#1a1a1a}
  .calc{padding:10px;width:240px}
  .calc .disp{border:1px solid #c8ccd2;border-radius:6px;text-align:right;padding:8px 10px;font-size:22px;margin-bottom:8px;background:#f7f9fc;min-height:42px;overflow:hidden}
  .calc .keys{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}
  .calc button,.btn{font:inherit;border:1px solid #c8ccd2;background:#f3f4f6;color:#1a1a1a;border-radius:6px;padding:6px 16px;cursor:pointer}
  .calc button{padding:11px 0;font-size:15px}
  .calc button:hover,.btn:hover{background:#e6e9ee}
  .calc button:active,.btn:active{background:#d6dae1}
  .term{background:#0c0c0c;color:#cccccc;height:100%;padding:8px 10px;overflow:auto;font-family:"Cascadia Mono",Consolas,"Courier New",monospace;font-size:13px;user-select:text}
  .term .line{white-space:pre-wrap}
  .term input{background:transparent;border:0;outline:0;color:#cccccc;font:inherit;width:80%}
  canvas.paint{background:#fff;display:block;cursor:crosshair}
  .toolbar{border-bottom:1px solid #e3e7ec;background:#f7f9fc;padding:5px 8px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
  .sw{width:20px;height:20px;border:1px solid #888;border-radius:4px;cursor:pointer}
  .file{display:flex;gap:8px;align-items:center;padding:5px 8px;cursor:default;border-radius:5px}
  .file:hover{background:#e5f1fb}
  .alert{position:fixed;inset:0;background:#0006;display:flex;align-items:center;justify-content:center;z-index:8000}
  .alert .box{background:#fff;border-radius:10px;padding:18px 20px;max-width:380px;min-width:260px;box-shadow:0 10px 40px #0007;line-height:1.5;color:#1a1a1a}
  .alert .btn{float:right;margin-top:14px;padding:5px 18px}
  .alert input{border:1px solid #9aa4b2 !important;border-radius:6px;padding:6px 8px !important;outline:0}
  .alert input:focus{border-color:var(--accent) !important}

  /* settings */
  .st{display:flex;height:100%;background:#f3f3f3;color:#1a1a1a}
  .st-nav{width:180px;flex:none;padding:10px 8px;background:#e9e9ec}
  .st-nav div{padding:9px 12px;border-radius:5px;cursor:default}
  .st-nav div:hover{background:#dcdce0}
  .st-nav .cur{background:#fff}
  .st-body{flex:1;padding:18px 24px;overflow:auto}
  .st h3{font-size:22px;font-weight:600;margin-bottom:12px}
  .st h4{margin:18px 0 8px;font-size:14px}
  .st .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:6px 0}
  .wp-grid{display:grid;grid-template-columns:repeat(auto-fill,124px);gap:10px}
  .wp{height:74px;border-radius:6px;border:2px solid transparent;cursor:pointer;position:relative;overflow:hidden}
  .wp.cur{border-color:var(--accent)}
  .wp span{position:absolute;left:7px;bottom:5px;font-size:11px;color:#fff;text-shadow:0 1px 2px #000}
  .acc-row{display:flex;gap:8px}
  .acc{width:28px;height:28px;border-radius:50%;cursor:pointer;border:2px solid transparent;box-shadow:0 0 0 1px #0003}
  .acc.cur{border-color:#000}

  /* ---- file explorer ---- */
  .xp{flex:1;min-height:0;display:flex;flex-direction:column;background:#fff;color:#1a1a1a;font:13px "Segoe UI",system-ui,-apple-system,sans-serif;user-select:none;outline:0}
  .xp button,.xp input{font:inherit;color:inherit}
  .xp-nav{display:flex;gap:4px;align-items:center;padding:6px 8px;background:#f3f6fb}
  .xp-nav .nb{width:30px;height:28px;border:0;background:transparent;border-radius:5px;cursor:pointer;font-size:16px}
  .xp-nav .nb:hover:not(:disabled){background:#dde8f5}
  .xp-nav .nb:disabled{opacity:.35;cursor:default}
  .xp-addr{flex:1;min-width:0;display:flex;align-items:center;background:#fff;border:1px solid #d5dbe3;border-radius:5px;height:28px;padding:0 6px;overflow:hidden;white-space:nowrap}
  .xp-addr span{padding:2px 5px;border-radius:4px;cursor:pointer}
  .xp-addr span:hover{background:#e5f1fb}
  .xp-addr i{font-style:normal;color:#777;padding:0 1px}
  .xp-search{width:160px;height:28px;border:1px solid #d5dbe3;border-radius:5px;padding:0 8px;background:#fff}
  .xp-bar{display:flex;align-items:center;gap:2px;padding:4px 8px;border-bottom:1px solid #e3e7ec;background:#fff;flex-wrap:wrap}
  .xp-bar .tb{border:0;background:transparent;padding:5px 9px;border-radius:5px;cursor:pointer;white-space:nowrap}
  .xp-bar .tb:hover:not(.dis){background:#e8f1fb}
  .xp-bar .tb.dis{opacity:.35;cursor:default}
  .xp-bar .sepv{width:1px;height:20px;background:#dcdfe4;margin:0 4px}
  .xp-main{flex:1;min-height:0;display:flex}
  .xp-side{width:170px;flex:none;overflow:auto;padding:8px 6px;border-right:1px solid #eceff3;background:#fafbfc}
  .xp-side .si{display:flex;gap:8px;align-items:center;padding:5px 8px;border-radius:5px;cursor:pointer;white-space:nowrap}
  .xp-side .si:hover{background:#eaf3fc}
  .xp-side .si.cur{background:#dbe9f8}
  .xp-side hr{border:0;border-top:1px solid #e3e6ea;margin:6px 4px}
  .xp-list{flex:1;overflow:auto;position:relative;min-width:0}
  .xp-row{display:grid;grid-template-columns:minmax(150px,1fr) 150px 120px 70px;align-items:center;padding:3px 8px;border:1px solid transparent;border-radius:4px;margin:0 6px}
  .xp-row.head{position:sticky;top:0;background:#fff;color:#555;border-bottom:1px solid #e3e6ea;border-radius:0;margin:0;padding:5px 14px;z-index:1}
  .xp-row.head div{cursor:pointer}
  .xp-row:not(.head):hover{background:#eaf3fc}
  .xp-row.sel{background:#cce8ff;border-color:#99d1ff}
  .xp-row .nm{display:flex;gap:7px;align-items:center}
  .xp-row div{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding-right:8px}
  .xp-grp{color:#0b5cad;padding:10px 14px 3px}
  .xp-icons{display:grid;grid-template-columns:repeat(auto-fill,96px);gap:6px;padding:10px}
  .xp-tile{text-align:center;padding:8px 4px;border:1px solid transparent;border-radius:5px;word-break:break-word}
  .xp-tile .g{font-size:36px}
  .xp-tile:hover{background:#eaf3fc}
  .xp-tile.sel{background:#cce8ff;border-color:#99d1ff}
  .xp-prev{width:240px;flex:none;border-left:1px solid #eceff3;padding:12px;overflow:auto;color:#444;white-space:pre-wrap;word-break:break-word;user-select:text}
  .xp-status{padding:4px 12px;border-top:1px solid #eceff3;color:#555;background:#fafbfc}
  .xp-empty{color:#777;text-align:center;padding:40px 10px}
  .pop{position:fixed;background:#fff;border:1px solid #c9ced6;border-radius:8px;box-shadow:0 6px 24px #0004;padding:4px;z-index:7000;min-width:180px;font:13px "Segoe UI",system-ui,sans-serif;color:#1a1a1a}
  .pop div{padding:6px 12px;border-radius:5px;cursor:default;white-space:nowrap}
  .pop div:hover:not(.dis){background:#e5f1fb}
  .pop div.dis{opacity:.4}
  .pop hr{border:0;border-top:1px solid #e3e6ea;margin:3px 2px}

  /* ---- new file dialog + editor ---- */
  .nf-back{position:fixed;inset:0;background:#0006;display:flex;align-items:center;justify-content:center;z-index:8000}
  .nf{background:#fff;border-radius:10px;padding:18px 20px;width:min(440px,92vw);box-shadow:0 10px 40px #0006;font:13px "Segoe UI",system-ui,sans-serif;color:#1a1a1a}
  .nf h3{font-size:16px;font-weight:600;margin-bottom:12px}
  .nf label{display:block;margin:12px 0 4px;color:#555}
  .nf-types{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
  .nf-types button{border:1px solid #d5dbe3;background:#fff;border-radius:8px;padding:8px 2px;cursor:pointer;font:inherit;color:inherit;display:flex;flex-direction:column;align-items:center;gap:2px}
  .nf-types button span{font-size:20px}
  .nf-types button:hover{background:#eef5fc}
  .nf-types button.on{background:#dbe9f8;border-color:#7ab4ea}
  .nf-name{width:100%;height:32px;border:1px solid #b9c3cf;border-radius:6px;padding:0 10px;font:inherit;color:inherit;outline:0}
  .nf-name:focus{border-color:#2b7fd4;box-shadow:0 0 0 2px #2b7fd433}
  .nf-hint{margin-top:6px;color:#666;font-size:12px;min-height:16px}
  .nf-btns{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}
  .nf-btns button{border-radius:6px;padding:6px 18px;font:inherit;cursor:pointer;border:1px solid #c5ccd6;background:#fff;color:#1a1a1a}
  .nf-btns .nf-ok{background:#1f6fd0;border-color:#1f6fd0;color:#fff}
  .ed{flex:1;min-height:0;display:flex;flex-direction:column;background:#fff;font:13px "Segoe UI",system-ui,sans-serif;color:#1a1a1a}
  .ed-bar{display:flex;gap:2px;padding:4px 6px;border-bottom:1px solid #e3e7ec;background:#f7f9fc;flex-wrap:wrap;align-items:center}
  .ed-bar button{border:0;background:transparent;padding:4px 9px;border-radius:5px;cursor:pointer;font:inherit;color:inherit;white-space:nowrap}
  .ed-bar button:hover{background:#e5f1fb}
  .ed-bar button.on{background:#d6e8fa}
  .ed-ta{flex:1;border:0;outline:0;resize:none;padding:10px 12px;font:13px/1.5 "Cascadia Mono",Consolas,"Courier New",monospace;tab-size:2;background:#fff;color:#1a1a1a;white-space:pre;overflow:auto;user-select:text}
  .ed-stat{display:flex;justify-content:space-between;padding:3px 10px;border-top:1px solid #eceff3;background:#fafbfc;color:#555;font-size:12px}
  .ed-stat .sv{color:#2a7d3f}

  /* ---- docs (word processor) ---- */
  .dc{flex:1;min-height:0;display:flex;flex-direction:column;background:#f1f3f4;font:13px "Segoe UI",system-ui,sans-serif;color:#1a1a1a}
  .dc-top{display:flex;gap:4px;align-items:center;padding:6px 10px;background:#fff;border-bottom:1px solid #e0e3e7;flex-wrap:wrap}
  .dc-top button{border:0;background:transparent;padding:4px 9px;border-radius:5px;cursor:pointer;font:inherit;color:inherit}
  .dc-top button:hover{background:#e5f1fb}
  .dc-title{font:16px "Segoe UI",system-ui,sans-serif;border:1px solid transparent;border-radius:4px;padding:2px 6px;min-width:140px;width:220px;color:inherit;background:transparent;outline:0}
  .dc-title:hover{border-color:#c5ccd6}
  .dc-title:focus{border-color:#2b7fd4;background:#fff}
  .dc-bar{display:flex;flex-wrap:wrap;gap:2px;align-items:center;padding:4px 8px;background:#edf2fa;border-bottom:1px solid #dde3ea}
  .dc-bar button{border:0;background:transparent;min-width:28px;height:28px;padding:0 6px;border-radius:5px;cursor:pointer;font:inherit;color:inherit}
  .dc-bar button:hover{background:#d9e6f6}
  .dc-bar button.on{background:#c7dcf5}
  .dc-bar select{height:28px;border:1px solid #cfd8e3;border-radius:5px;background:#fff;font:inherit;color:inherit;max-width:120px}
  .dc-bar input[type=color]{width:28px;height:26px;border:1px solid #cfd8e3;border-radius:5px;padding:1px;background:#fff;cursor:pointer}
  .dc-bar .sepv{width:1px;height:20px;background:#cfd8e3;margin:0 4px}
  .dc-pages{flex:1;overflow:auto;padding:18px 10px;min-height:0}
  .dc-page{background:#fff;width:100%;max-width:720px;min-height:920px;margin:0 auto;padding:56px 64px;box-shadow:0 1px 4px #0003;outline:0;font:15px/1.6 Arial,sans-serif;color:#000;user-select:text;overflow-wrap:break-word}
  .dc-page h1{font-size:2em;margin:.6em 0 .3em;line-height:1.2}
  .dc-page h2{font-size:1.5em;margin:.6em 0 .3em;line-height:1.25}
  .dc-page h3{font-size:1.2em;margin:.6em 0 .3em}
  .dc-page p{margin:0 0 .6em}
  .dc-page blockquote{margin:.6em 0;padding-left:14px;border-left:4px solid #c5ccd6;color:#444}
  .dc-page ul,.dc-page ol{margin:0 0 .6em 1.6em}
  .dc-page table{border-collapse:collapse;width:100%;margin:.6em 0}
  .dc-page td,.dc-page th{border:1px solid #888;padding:6px;min-width:40px;vertical-align:top}
  .dc-page img{max-width:100%}
  .dc-page a{color:#1a5fb4}
  .dc-page hr{border:0;border-top:1px solid #999;margin:1em 0}
  .dc-stat{display:flex;justify-content:space-between;padding:3px 12px;border-top:1px solid #dde3ea;background:#fff;color:#555;font-size:12px}
  .dc-stat .sv{color:#2a7d3f}
  .dh{padding:16px 18px;background:#f1f3f4;min-height:100%;font:13px "Segoe UI",system-ui,sans-serif;color:#1a1a1a}
  .dh h4{font-size:14px;font-weight:600;margin:4px 0 10px}

  <div class="lk-user"><div class="lk-av">👤</div><div>Lakshiv</div><small>Click anywhere to sign in</small></div>
</div>

<div id="desktop"></div>
<div id="windows"></div>

<div id="startmenu">
  <div class="sm-rail">
    <button id="sm-docs" title="Documents">📄</button>

</div>

  <div id="tstart" class="tstart" title="Start"><div class="winlogo"><i></i><i></i><i></i><i></i></div></div>

    <span class="tray-i" title="Network">📶</span><span class="tray-i" title="Volume">🔊</span>
    <div id="clock"><div class="ct"></div><div class="cd"></div></div>
    <div id="showdesk" title="Show desktop"></div>
  </div>
</div>

<script>
/* pristine copy of this page, used by "Download Lakshiv OS" */
const ORIGINAL_HTML = '<!DOCTYPE html>\n' + document.documentElement.outerHTML;
const desktop = document.getElementById('desktop');
let z = 10;

/* ---------- helpers ---------- */
const store = {
  get(k, d){ try { const v = localStorage.getItem(k); return v === null ? d : v; } catch(e){ return d; } },
  set(k, v){ try { localStorage.setItem(k, v); } catch(e){} }
};
const $id = id => document.getElementById(id);
const wins = $id('windows');
const TB_H = 40;
const deskW = () => window.innerWidth, deskH = () => window.innerHeight - TB_H;

/* ---------- wallpaper ---------- */
const WALLS = {
  waves:  {name:'Waves',  bg:['#050d24','#0f3460'], layers:['#1e5fa8','#2a82c7','#4aa3df']},
  sunset: {name:'Sunset', bg:['#2b0f3a','#8a2d5b'], layers:['#d9483b','#f0a04b','#ffd27a']},
  forest: {name:'Forest', bg:['#06201a','#0e4a3a'], layers:['#1f7a5c','#2fa37a','#6fd3a5']},
  candy:  {name:'Candy',  bg:['#2a1450','#7a2f9e'], layers:['#d94fa0','#f27ac0','#ffb3de']},
  slate:  {name:'Slate',  bg:['#101114','#2a2d33'], layers:['#3a3e46','#4b505a','#6a707c']}
};
const wallCv = $id('wall'); let wallCtx = null;
try { wallCtx = wallCv.getContext('2d'); } catch(e){}
let wallId = store.get('los-wall', 'waves'), wallAnim = store.get('los-anim', '1') === '1';
if (!WALLS[wallId]) wallId = 'waves';
function drawWall(t){
  if (!wallCtx) return;
  const W = wallCv.width, H = wallCv.height, cfg = WALLS[wallId] || WALLS.waves;
  const g = wallCtx.createLinearGradient(0, 0, 0, H); g.addColorStop(0, cfg.bg[0]); g.addColorStop(1, cfg.bg[1]);
  wallCtx.globalAlpha = 1; wallCtx.fillStyle = g; wallCtx.fillRect(0, 0, W, H);
  cfg.layers.forEach((col, i) => {
    wallCtx.beginPath(); wallCtx.moveTo(0, H);
    const amp = H * (0.045 + 0.02 * i), base = H * (0.52 + 0.13 * i), k = (1.1 + i * 0.6) * Math.PI * 2 / W, sp = t / 1000 * (0.5 + i * 0.25) * (i % 2 ? -1 : 1);
    for (let x = 0; x <= W + 8; x += 8) wallCtx.lineTo(x, base + Math.sin(x * k + sp) * amp + Math.sin(x * k * 2.3 + sp * 1.7) * amp * 0.4);
    wallCtx.lineTo(W, H); wallCtx.closePath(); wallCtx.globalAlpha = 0.55; wallCtx.fillStyle = col; wallCtx.fill();
  });
  wallCtx.globalAlpha = 1;
}
function sizeWall(){ wallCv.width = window.innerWidth; wallCv.height = window.innerHeight; drawWall(performance.now()); }
let wallRaf = 0, lastT = 0;
function wallTick(t){ wallRaf = requestAnimationFrame(wallTick); if (t - lastT < 33) return; lastT = t; drawWall(t); }
function startWall(){
  if (wallRaf) cancelAnimationFrame(wallRaf); wallRaf = 0;
  if (wallAnim && wallCtx && typeof requestAnimationFrame === 'function') wallRaf = requestAnimationFrame(wallTick); else drawWall(0);
}
function setWall(id){ if (!WALLS[id]) return; wallId = id; store.set('los-wall', id); drawWall(performance.now()); }
function setAnim(on){ wallAnim = !!on; store.set('los-anim', on ? '1' : '0'); startWall(); }
function setAccent(c, save){ document.documentElement.style.setProperty('--accent', c); if (save) store.set('los-accent', c); }
setAccent(store.get('los-accent', '#0078d4'));

/* ---------- clock + lock screen ---------- */
function tickClock(){
  const n = new Date();
  const t = n.toLocaleTimeString([], {hour:'numeric', minute:'2-digit'});
  $id('clock').querySelector('.ct').textContent = t;
  $id('clock').querySelector('.cd').textContent = n.toLocaleDateString('en-US', {month:'numeric', day:'numeric', year:'numeric'});
  document.querySelector('.lk-time').textContent = t;
  document.querySelector('.lk-date').textContent = n.toLocaleDateString('en-US', {weekday:'long', month:'long', day:'numeric'});
}
tickClock(); setInterval(tickClock, 10000);
const boot = $id('boot');
function signIn(){
  boot.classList.add('hide');
  setTimeout(() => { if (boot.classList.contains('hide')) boot.style.display = 'none'; }, 450);
  if (!store.get('los-welcomed', '')) { store.set('los-welcomed', '1'); open('readme'); }
}
function showLock(){ boot.style.display = ''; void boot.offsetWidth; boot.classList.remove('hide'); tickClock(); }
boot.onclick = signIn;

/* ---------- actions ---------- */
let installEvt = null;
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); installEvt = e; });
if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) navigator.serviceWorker.register('sw.js').catch(() => {});
function act(a){
  if (a === 'about') return alertBox('Lakshiv OS 1\n\nA desktop environment in your browser, built with HTML, CSS and JavaScript.');
  if (a === 'newfile') return newFile();
  if (a === 'dlos') return downloadText('lakshiv-os.html', 'text/html', ORIGINAL_HTML);
  if (a === 'install') {
    if (installEvt) { const e = installEvt; installEvt = null; return e.prompt(); }
    return alertBox('Ways to use Lakshiv OS as an app:\n\n1. Download Lakshiv OS (Start ▸ Power) and keep the file on your computer.\n\n2. Windows: use "Launch Lakshiv OS.bat" from the app package to open it in its own window.\n\n3. Host the app package on GitHub Pages, open that link in Chrome or Edge, and click the Install icon in the address bar.');
  }
  if (a === 'closeAll') allWins().forEach(w => w.remove());
  if (a === 'restart') location.reload();
  if (a === 'empty') return emptyTrash();
}
function alertBox(msg){
  const el = document.createElement('div'); el.className = 'alert';
  el.innerHTML = '<div class="box"><div style="white-space:pre-wrap"></div><button class="btn">OK</button></div>';
  el.querySelector('.box > div').textContent = msg;
  el.querySelector('button').onclick = () => el.remove();
  document.body.appendChild(el);
}

/* ---------- window manager ---------- */
function allWins(){ return [...wins.querySelectorAll('.win')]; }
function winIcon(id){
  if (typeof apps !== 'undefined' && apps[id]) return apps[id].icon;
  if (id.startsWith('file:')) { const it = byId(id.slice(5)); return it ? iconOf(it) : '📄'; }
  if (id.startsWith('site:')) return '🌐';
  if (id.startsWith('run:')) return '▶️';
  if (id === 'dochome') return '📘';
  return '🗔';
}
function topWin(){ let best = null; allWins().forEach(w => { if (!w.classList.contains('min') && (!best || +w.style.zIndex > +best.style.zIndex)) best = w; }); return best; }
function focusWin(w){
  if (!w) return;
  allWins().forEach(x => x.classList.remove('active'));
  w.classList.add('active'); w.style.zIndex = ++z; renderTaskbar();
}
function minimizeWin(w){ w.classList.add('min'); w.classList.remove('active'); const t = topWin(); if (t) focusWin(t); else renderTaskbar(); }
function restoreWin(w){ w.classList.remove('min'); focusWin(w); }
function updateMaxBtn(w){ const b = w.querySelector('.wb.max'); if (b) { b.textContent = w.classList.contains('max') ? '❐' : '☐'; b.title = w.classList.contains('max') ? 'Restore' : 'Maximize'; } }
function rectOf(w){ return {l:w.offsetLeft, t:w.offsetTop, w:w.offsetWidth, h:w.offsetHeight}; }
function toggleMax(w){
  if (w.classList.contains('max')) {
    const r = JSON.parse(w.dataset.rect || 'null');
    if (r) Object.assign(w.style, {left:r.l+'px', top:r.t+'px', width:r.w+'px', height:r.h+'px'});
    w.classList.remove('max');
  } else {
    w.dataset.rect = JSON.stringify(rectOf(w));
    Object.assign(w.style, {left:'0px', top:'0px', width:deskW()+'px', height:deskH()+'px'}); w.classList.add('max');
  }
  updateMaxBtn(w);
}
function snapWin(w, side){
  if (!w.classList.contains('max')) w.dataset.rect = JSON.stringify(rectOf(w));
  const half = Math.floor(deskW() / 2);
  Object.assign(w.style, {left:(side === 'l' ? 0 : half)+'px', top:'0px', width:(side === 'l' ? half : deskW() - half)+'px', height:deskH()+'px'});
  w.classList.add('max'); updateMaxBtn(w);
}
function makeWindow(id, title, x, y, w, h, build){
  const existing = wins.querySelector('.win[data-id="'+id+'"]');
  if (existing) { existing.classList.remove('min'); focusWin(existing); return existing; }
  w = Math.max(240, Math.min(w, deskW() - 8)); h = Math.max(160, Math.min(h, deskH() - 8));
  x = Math.max(0, Math.min(x, deskW() - w)); y = Math.max(0, Math.min(y, deskH() - h));
  const win = document.createElement('div');
  win.className = 'win'; win.dataset.id = id; win.dataset.icon = winIcon(id);
  win.style.cssText = 'left:'+x+'px;top:'+y+'px;width:'+w+'px;height:'+h+'px';
  win.innerHTML = '<div class="titlebar"><span class="wicon"></span><span class="title"></span><div class="wbtns"><button class="wb min" title="Minimize">—</button><button class="wb max" title="Maximize">☐</button><button class="wb close" title="Close">✕</button></div></div><div class="content"></div>' +
    ['n','s','e','w','ne','nw','se','sw'].map(d => '<div class="rz" data-d="'+d+'"></div>').join('');
  win.querySelector('.wicon').textContent = win.dataset.icon;
  win.querySelector('.title').textContent = title;
  wins.appendChild(win);
  build(win.querySelector('.content'), win);
  focusWin(win);

  win.addEventListener('mousedown', () => { if (!win.classList.contains('active')) focusWin(win); });
  win.querySelector('.wb.close').onclick = () => win.remove();
  win.querySelector('.wb.min').onclick = () => minimizeWin(win);
  win.querySelector('.wb.max').onclick = () => toggleMax(win);
  const tb = win.querySelector('.titlebar');
  tb.addEventListener('dblclick', e => { if (!e.target.closest('.wbtns')) toggleMax(win); });
  tb.addEventListener('mousedown', e => {
    if (e.target.closest('.wbtns') || e.button) return;
    let ox = e.clientX - win.offsetLeft, oy = e.clientY - win.offsetTop, moved = false;
    const mv = ev => {
      if (!moved && Math.abs(ev.clientX - e.clientX) + Math.abs(ev.clientY - e.clientY) < 4) return;
      moved = true;
      if (win.classList.contains('max')) {
        const ratio = ev.clientX / Math.max(1, win.offsetWidth);
        const r = JSON.parse(win.dataset.rect || 'null') || {w:Math.min(700, deskW() - 40), h:Math.min(480, deskH() - 40)};
        win.classList.remove('max'); win.style.width = r.w+'px'; win.style.height = r.h+'px'; ox = r.w * ratio; oy = 17; updateMaxBtn(win);
      }
      win.style.left = (ev.clientX - ox)+'px'; win.style.top = Math.max(0, Math.min(deskH() - 34, ev.clientY - oy))+'px';
    };
    const up = ev => {
      document.removeEventListener('mousemove', mv); document.removeEventListener('mouseup', up);
      if (!moved) return;
      if (ev.clientY <= 2) toggleMax(win); else if (ev.clientX <= 2) snapWin(win, 'l'); else if (ev.clientX >= deskW() - 3) snapWin(win, 'r');
    };
    document.addEventListener('mousemove', mv); document.addEventListener('mouseup', up);
  });
  win.querySelectorAll('.rz').forEach(hd => hd.addEventListener('mousedown', e => {
    e.stopPropagation(); e.preventDefault(); focusWin(win);
    const d = hd.dataset.d, sx = e.clientX, sy = e.clientY, L = win.offsetLeft, T = win.offsetTop, W = win.offsetWidth, H = win.offsetHeight;
    const mv = ev => {
      const dx = ev.clientX - sx, dy = ev.clientY - sy; let l = L, t = T, w2 = W, h2 = H;
      if (d.includes('e')) w2 = Math.max(240, W + dx);
      if (d.includes('s')) h2 = Math.max(160, H + dy);
      if (d.includes('w')) { w2 = Math.max(240, W - dx); l = L + W - w2; }
      if (d.includes('n')) { h2 = Math.max(160, H - dy); t = T + H - h2; }
      Object.assign(win.style, {left:l+'px', top:Math.max(0, t)+'px', width:w2+'px', height:h2+'px'});
    };
    const up = () => { document.removeEventListener('mousemove', mv); document.removeEventListener('mouseup', up); };
    document.addEventListener('mousemove', mv); document.addEventListener('mouseup', up);
  }));
  return win;
}
window.addEventListener('resize', () => {
  sizeWall();
  allWins().filter(w => w.classList.contains('max')).forEach(w => {
    const half = w.offsetWidth < deskW() - 4 && w.offsetLeft === 0 ? 'l' : null;
    Object.assign(w.style, {width:(half ? Math.floor(deskW()/2) : deskW())+'px', height:deskH()+'px'});
  });
  renderDesktop(true);
});

/* ---------- taskbar ---------- */
const tbWins = $id('tbwins');
function renderTaskbar(){
  tbWins.innerHTML = '';
  allWins().forEach(w => {
    const mini = w.classList.contains('min'), on = w.classList.contains('active') && !mini;
    const b = document.createElement('div');
    b.className = 'tbtn open' + (on ? ' active' : '') + (mini ? ' mini' : '');
    b.title = w.querySelector('.title').textContent; b.textContent = w.dataset.icon || '🗔';
    b.onclick = () => { if (mini) restoreWin(w); else if (on) minimizeWin(w); else focusWin(w); };
    b.onauxclick = e => { if (e.button === 1) w.remove(); };
    b.oncontextmenu = e => { e.preventDefault(); popup(e.clientX, e.clientY, [{label:mini ? 'Restore' : 'Minimize', fn:() => mini ? restoreWin(w) : minimizeWin(w)}, {label:'Close window', fn:() => w.remove()}]); };
    tbWins.appendChild(b);
  });
}
new MutationObserver(() => {
  renderTaskbar();
  if (!wins.querySelector('.win.active:not(.min)')) { const t = topWin(); if (t) focusWin(t); }
}).observe(wins, {childList:true});
let hiddenByShowDesk = [];
$id('showdesk').onclick = () => {
  const open_ = allWins().filter(w => !w.classList.contains('min'));
  if (open_.length) { hiddenByShowDesk = open_; open_.forEach(w => { w.classList.add('min'); w.classList.remove('active'); }); renderTaskbar(); }
  else { hiddenByShowDesk.filter(w => w.isConnected).forEach(w => w.classList.remove('min')); const t = topWin(); if (t) focusWin(t); hiddenByShowDesk = []; }
};

/* ---------- start menu ---------- */
const sm = $id('startmenu');
function openBrowserWith(q){ apps.browser.open(); if (browserGo) browserGo(q); }
function toggleStart(show){
  const on = show === undefined ? !sm.classList.contains('show') : show;
  sm.classList.toggle('show', on); $id('tstart').classList.toggle('on', on);
  if (on) { closeCal(); const i = sm.querySelector('.sm-search'); i.value = ''; renderStart(''); setTimeout(() => i.focus(), 0); }
}
function renderStart(q){
  const body = sm.querySelector('.sm-body'); body.innerHTML = ''; q = q.trim().toLowerCase();
  const head = t => { const h = document.createElement('h5'); h.textContent = t; body.appendChild(h); };
  const row = (icon, label, tag, fn) => {
    const r = document.createElement('div'); r.className = 'sm-row'; r.innerHTML = '<span></span><div></div><small></small>';
    r.children[0].textContent = icon; r.children[1].textContent = label; r.children[2].textContent = tag || '';
    r.onclick = () => { toggleStart(false); fn(); }; body.appendChild(r); return r;
  };
  if (!q) {
    head('Pinned');
    const g = document.createElement('div'); g.className = 'sm-grid';
    order.forEach(id => {
      const a = apps[id], t = document.createElement('div'); t.className = 'sm-app'; t.innerHTML = '<span></span><div></div>';
      t.children[0].textContent = a.icon; t.children[1].textContent = a.name; t.onclick = () => { toggleStart(false); a.open(); }; g.appendChild(t);
    });
    body.appendChild(g);
    const recent = FS.filter(x => x.type === 'file' && !x.trashed).sort((a, b) => b.modified - a.modified).slice(0, 5);
    if (recent.length) { head('Recent'); recent.forEach(it => row(iconOf(it), it.name, dateLabel(it.modified), () => openFile(it.id))); }
  } else {
    head('Best match');
    order.forEach(id => { if (apps[id].name.toLowerCase().includes(q)) row(apps[id].icon, apps[id].name, 'App', () => apps[id].open()); });
    FS.filter(x => !x.trashed && x.name.toLowerCase().includes(q)).slice(0, 8).forEach(it => row(iconOf(it), it.name, it.type === 'folder' ? 'Folder' : 'File', () => it.type === 'folder' ? openExplorer(it.id) : openFile(it.id)));
    row('🌐', 'Search the web for “' + q + '”', 'Web', () => openBrowserWith(q));
  }
}
sm.querySelector('.sm-search').addEventListener('input', e => renderStart(e.target.value));
sm.querySelector('.sm-search').addEventListener('keydown', e => {
  if (e.key === 'Enter') { const r = sm.querySelector('.sm-body .sm-row'); if (r) r.click(); }
  if (e.key === 'Escape') toggleStart(false);
});
$id('tstart').onclick = () => toggleStart();
$id('tsearch').onclick = () => toggleStart(true);
$id('sm-docs').onclick = () => { toggleStart(false); openExplorer(documentsId()); };
$id('sm-pics').onclick = () => { toggleStart(false); const f = FS.find(x => x.parent === 'root' && x.name === 'Pictures' && !x.trashed); openExplorer(f ? f.id : 'root'); };
$id('sm-set').onclick = () => { toggleStart(false); apps.settings.open(); };
$id('sm-power').onclick = e => {
  const r = e.currentTarget.getBoundingClientRect();
  popup(r.right + 6, r.top, [
    {label:'Sign out', fn:() => { toggleStart(false); showLock(); }},
    {label:'Restart', fn:() => act('restart')},
    {label:'Close all windows', fn:() => { toggleStart(false); act('closeAll'); }}, '-',
    {label:'Download Lakshiv OS…', fn:() => act('dlos')},
    {label:'Install as app…', fn:() => act('install')},
    {label:'About Lakshiv OS', fn:() => act('about')}
  ]);
};

/* ---------- calendar ---------- */
let calOff = 0;
function drawCal(){
  const cal = $id('cal'), n = new Date(), first = new Date(n.getFullYear(), n.getMonth() + calOff, 1);
  cal.innerHTML = '<div class="cal-h"><b></b><div><button data-d="-1" title="Previous month">▲</button><button data-d="1" title="Next month">▼</button></div></div><div class="cal-g"></div>';
  cal.querySelector('b').textContent = first.toLocaleDateString('en-US', {month:'long', year:'numeric'});
  const g = cal.querySelector('.cal-g');
  ['Su','Mo','Tu','We','Th','Fr','Sa'].forEach(d => { const c = document.createElement('div'); c.className = 'dow'; c.textContent = d; g.appendChild(c); });
  const start = new Date(first); start.setDate(1 - first.getDay());
  for (let i = 0; i < 42; i++) {
    const d = new Date(start); d.setDate(start.getDate() + i);
    const c = document.createElement('div'); c.textContent = d.getDate();
    if (d.getMonth() !== first.getMonth()) c.className = 'dim';
    if (d.toDateString() === n.toDateString()) c.className = 'today';
    g.appendChild(c);
  }
  cal.querySelectorAll('button').forEach(b => b.onclick = () => { calOff += +b.dataset.d; drawCal(); });
}
function closeCal(){ $id('cal').classList.remove('show'); }
$id('clock').onclick = () => {
  const c = $id('cal'), on = !c.classList.contains('show');
  if (on) { toggleStart(false); calOff = 0; drawCal(); }
  c.classList.toggle('show', on);
};
document.addEventListener('mousedown', e => {
  if (sm.classList.contains('show') && !e.target.closest('#startmenu,#tstart,#tsearch,.pop')) toggleStart(false);
  if (!e.target.closest('#cal,#clock,.pop')) closeCal();
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') { toggleStart(false); closeCal(); } });

/* ---------- settings ---------- */
function buildSettings(c){
  c.style.overflow = 'hidden';
  c.innerHTML = '<div class="st"><div class="st-nav"></div><div class="st-body"></div></div>';
  const nav = c.querySelector('.st-nav'), body = c.querySelector('.st-body'); let tab = 'p';
  const draw = () => {
    nav.innerHTML = '';
    [['p', '🎨  Personalization'], ['s', '💻  System']].forEach(([k, l]) => {

/* ---------- file system ---------- */
const uid = () => Math.random().toString(36).slice(2,9);
const nowTs = () => Date.now();
function seedFS(){
  const t = nowTs();
  const mk = (name, parent, type, content) => ({id:uid(), name, type:type||'folder', parent, content:content||'', created:t, modified:t});
  const desk=mk('Desktop','root'), docs=mk('Documents','root'), dl=mk('Downloads','root'), pics=mk('Pictures','root'), vids=mk('Videos','root'), mus=mk('Music','root');
  return [desk,docs,dl,pics,vids,mus,
    mk('readme.txt', docs.id, 'file', 'Welcome to Lakshiv OS!\n\nThis File Explorer really works:\n- New folders and files\n- Cut, copy, paste, rename, delete\n- Recycle Bin with restore\n- Search, sort and preview\n\nTip: right-click anywhere.')];
}
let FS = null;
try { FS = JSON.parse(localStorage.getItem('los-fs2') || 'null'); } catch(e){}
if (!Array.isArray(FS) || !FS.length) FS = seedFS();
const saveFs = () => { try { localStorage.setItem('los-fs2', JSON.stringify(FS)); } catch(e){ if (!saveFs.warned) { saveFs.warned = true; alertBox('Browser storage is full, so your latest changes may not be saved. Try deleting large files or images.'); } } };
const byId = id => FS.find(x => x.id === id);
const kids = pid => FS.filter(x => x.parent === pid && !x.trashed);
function descIds(id, incl, live){
  const out = new Set(incl ? [id] : []);
  const walk = p => FS.forEach(x => { if (x.parent === p && !out.has(x.id) && !(live && x.trashed)) { out.add(x.id); walk(x.id); } });
  walk(id); return out;
}
function cleanName(raw){ return String(raw).replace(/[<>:"\/\\|?*]/g, '').trim(); }
function uniqueName(pid, name, ign){
  const names = new Set(FS.filter(x => x.parent === pid && !x.trashed && x.id !== ign).map(x => x.name.toLowerCase()));
  if (!names.has(name.toLowerCase())) return name;
  const m = name.match(/^(.*?)(\.[^.]+)?$/), base = m[1], ext = m[2] || ''; let i = 2;
  while (names.has((base+' ('+i+')'+ext).toLowerCase())) i++;
  return base+' ('+i+')'+ext;
}
function createItem(pid, type, name, content){
  const t = nowTs(), it = {id:uid(), name:uniqueName(pid, name), type, parent:pid, content:content||'', created:t, modified:t};
  FS.push(it); saveFs(); return it;
}
const extOf = it => { const m = it.name.match(/\.([^.]+)$/); return m ? m[1].toLowerCase() : ''; };
const TYPES = {ldoc:'Lakshiv Document', txt:'Text Document', md:'Markdown File', html:'HTML Document', htm:'HTML Document', css:'CSS File', js:'JavaScript File', json:'JSON File', csv:'CSV File'};
function typeLabel(it){ if (it.type === 'folder') return 'File folder'; const e = extOf(it); return TYPES[e] || (e ? e.toUpperCase()+' File' : 'File'); }
function sizeOf(it){ if (it.type === 'folder') return 0; try { return new Blob([it.content]).size; } catch(e){ return it.content.length; } }
function sizeLabel(it){ return it.type === 'folder' ? '' : Math.max(1, Math.ceil(sizeOf(it)/1024)) + ' KB'; }
function iconOf(it){
  if (it.type === 'folder') return '📁';
  const e = extOf(it);
  if (e === 'ldoc') return '📘';
  if (e === 'html' || e === 'htm') return '🌐';
  if (['js','json','css'].includes(e)) return '📜';
  if (e === 'csv') return '📊';
  return '📄';
}
const dateLabel = ts => new Date(ts).toLocaleString('en-US', {month:'numeric', day:'numeric', year:'numeric', hour:'numeric', minute:'2-digit'}).replace(',', '');
function groupOf(ts){
  const sod = x => new Date(x.getFullYear(), x.getMonth(), x.getDate()).getTime();
  const diff = Math.round((sod(new Date()) - sod(new Date(ts))) / 864e5);
  if (diff <= 0) return 'Today'; if (diff === 1) return 'Yesterday';
  if (diff < 7) return 'Earlier this week'; if (diff < 31) return 'Earlier this month'; return 'A long time ago';
}
function pathOf(id){ const out = []; let it = byId(id); while (it) { out.unshift(it); it = byId(it.parent); } return out; }

function cloneTree(it, pid){
  const t = nowTs(), ks = FS.filter(x => x.parent === it.id && !x.trashed);
  const n = Object.assign({}, it, {id:uid(), parent:pid, name:uniqueName(pid, it.name), created:t, modified:t});
  delete n.trashed; delete n.deletedAt;
  FS.push(n); ks.forEach(k => cloneTree(k, n.id)); return n;
}
let clip = null;
function pasteInto(pid){
  if (!clip) return [];
  const made = [];
  for (const id of clip.ids) {
    const it = byId(id); if (!it || it.trashed) continue;
    if (it.type === 'folder' && (pid === it.id || descIds(it.id, true, true).has(pid))) { alertBox("You can't put a folder inside itself."); continue; }
    if (clip.mode === 'cut') { if (it.parent !== pid) { it.parent = pid; it.name = uniqueName(pid, it.name, it.id); } made.push(it.id); }
    else made.push(cloneTree(it, pid).id);
  }
  if (clip.mode === 'cut') clip = null;
  saveFs(); return made;
}
function closeWinFor(id){
  descIds(id, true).forEach(x => ['file:'+x, 'run:'+x].forEach(k => { const w = document.querySelector('.win[data-id="'+k+'"]'); if (w) w.remove(); }));
}
function trashItems(ids){ ids.forEach(id => { const it = byId(id); if (it) { it.trashed = true; it.deletedAt = nowTs(); closeWinFor(id); } }); saveFs(); }
function restoreItems(ids){
  ids.forEach(id => {
    const it = byId(id); if (!it) return;
    it.trashed = false; delete it.deletedAt;
    if (it.parent !== 'root') { const p = byId(it.parent); if (!p || p.trashed) it.parent = 'root'; }
    it.name = uniqueName(it.parent, it.name, it.id);
  });
  saveFs();
}
function purgeItems(ids){
  const rm = new Set(); ids.forEach(id => descIds(id, true).forEach(x => rm.add(x)));
  rm.forEach(closeWinFor);
  FS = FS.filter(x => !rm.has(x.id)); saveFs();
}
let explorerRefresh = null, explorerGo = null, explorerCwd = null;
function refreshExplorer(){ if (explorerRefresh && document.querySelector('.win[data-id="files"]')) explorerRefresh(); refreshDocsHome(); renderDesktop(); }
function emptyTrash(){
  const ids = FS.filter(x => x.trashed).map(x => x.id);
  if (!ids.length) return alertBox('The Recycle Bin is already empty.');
  confirmBox('Permanently delete all ' + ids.length + ' item(s) in the Recycle Bin?', () => { purgeItems(ids); refreshExplorer(); });
}

const KNOWN_EXT = /\.(txt|ldoc|md|html?|css|js|json|csv)$/i;
function newFileDialog(pid, kind, cb){
  let type = FILE_TYPES.find(t => t[0] === kind) || FILE_TYPES[0];

  el.innerHTML = '<div class="nf"><h3>Create new file</h3><div class="nf-types"></div><label>File name</label><input class="nf-name" spellcheck="false" autocomplete="off"><div class="nf-hint"></div><div class="nf-btns"><button class="nf-cancel">Cancel</button><button class="nf-ok">Create</button></div></div>';

  const where = pid === 'root' ? 'This PC' : pathOf(pid).map(x => x.name).join(' › ');
  const fullName = () => { let n = cleanName(inp.value); if (n && !/\.[^.]+$/.test(n)) n += type[3]; return n; };
  const updateHint = () => {
    const n = fullName();

    hint.textContent = !n ? 'Enter a file name.' : (final !== n ? 'That name is taken, so it will be saved as "' + final + '" in ' + where + '.' : 'Will be created in ' + where + '.');

    b.onclick = () => {
      const stem = inp.value.trim().replace(KNOWN_EXT, '') || 'untitled';
      type = t; inp.value = stem + t[3]; mark(); updateHint(); inp.focus(); inp.setSelectionRange(0, stem.length);
    };
    types.appendChild(b); return b;
  });
  const mark = () => chips.forEach((b, i) => b.classList.toggle('on', FILE_TYPES[i] === type));
  inp.value = (type[0] === 'html' ? 'index' : 'untitled') + type[3];
  inp.oninput = updateHint;
  const close = () => el.remove();

    const name = fullName();

    const m = name.match(/\.([^.]+)$/), ext = m ? m[1].toLowerCase() : '';

const escapeHtml = t => String(t).replace(/[&<>"]/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[ch]));
function cleanHtml(html){
  const doc = new DOMParser().parseFromString(html, 'text/html');
  doc.querySelectorAll('script,style,iframe,object,embed,link,meta,base,form').forEach(n => n.remove());
  doc.querySelectorAll('*').forEach(n => [...n.attributes].forEach(a => {
    const nm = a.name.toLowerCase(), v = a.value.trim().toLowerCase();
    if (nm.startsWith('on') || ((nm === 'href' || nm === 'src' || nm === 'xlink:href') && /^(javascript|vbscript|data:text)/.test(v))) n.removeAttribute(a.name);
  }));
  return doc.body.innerHTML;
}

  const spaced = String(html).replace(/<\/(p|h[1-6]|li|div|tr|blockquote)>|<br\s*\/?>/gi, m => m + '\n');

}

        const cols = r.children; cols[1].textContent = dateLabel(it.modified); cols[2].textContent = typeLabel(it); cols[3].textContent = sizeLabel(it);
        bindItem(r, it); L.appendChild(r);
      });
    } else {
      const g = document.createElement('div'); g.className = 'xp-icons';
      list.forEach(it => {
        const t = document.createElement('div'); t.className = 'xp-tile'; t.innerHTML = '<div class="g"></div><div></div>';

    const p = $('.xp-prev'); p.style.display = showPrev ? 'block' : 'none';

    const its = selItems();
    if (its.length !== 1) { p.textContent = its.length > 1 ? its.length + ' items selected.' : 'Select a file to preview.'; return; }
    const it = its[0];
    if (it.type === 'folder') p.textContent = '📁 ' + it.name + '\n\n' + kids(it.id).length + ' item(s)';
    else { const body = extOf(it) === 'ldoc' ? htmlToText(it.content) : it.content; p.textContent = iconOf(it) + ' ' + it.name + '\n\n' + (body.length > 1500 ? body.slice(0, 1500) + '…' : (body || '(empty file)')); }
  }
  function renderStatus(){
    const n = items().length;
    $('.xp-status').textContent = n + ' item' + (n === 1 ? '' : 's') + (sel.size ? '   |   ' + sel.size + ' selected' : '');
  }
  function select(id, multi){
    if (multi) { if (sel.has(id)) sel.delete(id); else sel.add(id); } else sel = new Set([id]);
    updateSel();
  }
  function updateSel(){
    c.querySelectorAll('.xp-list [data-id]').forEach(el => el.classList.toggle('sel', sel.has(el.dataset.id)));
    renderBar(); renderPrev(); renderStatus();
  }
  function ctx(e, onItem){
    e.preventDefault(); e.stopPropagation();
    let m;
    if (cwd === 'trash') m = onItem ? [{label:'Restore', fn:restoreSel}, {label:'Delete permanently', fn:deleteForever}] : [{label:'Empty Recycle Bin', fn:emptyTrash, dis:!FS.some(x => x.trashed)}];
    else if (onItem) { const one = sel.size === 1; m = [{label:'Open', fn:() => openItem(selItems()[0]), dis:!one}, '-', {label:'Cut', fn:() => setClip('cut')}, {label:'Copy', fn:() => setClip('copy')}, '-', {label:'Rename', fn:renameSel, dis:!one}, {label:'Delete', fn:deleteSel}]; }
    else m = [{label:'New folder', fn:() => doNew('folder')}, {label:'New text document', fn:() => doNew('txt')}, {label:'New HTML file', fn:() => doNew('html')}, '-', {label:'Paste', fn:doPaste, dis:!clip}, {label:'Refresh', fn:refresh}];
    popup(e.clientX, e.clientY, m);
  }
  function refresh(){ renderNav(); renderBar(); renderSide(); renderList(); renderPrev(); renderStatus(); refreshDocsHome(); renderDesktop(); }

  /* wiring */
  $('[data-k=back]').onclick = () => { if (hi > 0) { hi--; navigate(hist[hi], false); } };
  $('[data-k=fwd]').onclick = () => { if (hi < hist.length - 1) { hi++; navigate(hist[hi], false); } };
  $('[data-k=up]').onclick = () => navigate(parentOf());
  $('[data-k=ref]').onclick = () => refresh();
  $('.xp-search').oninput = e => { q = e.target.value.trim().toLowerCase(); sel = new Set(); renderList(); renderBar(); renderPrev(); renderStatus(); };
  const xp = $('.xp');
  xp.addEventListener('mousedown', e => { if (e.target.tagName !== 'INPUT') xp.focus(); });
  xp.addEventListener('keydown', e => {
    if (e.target.tagName === 'INPUT') return;
    const k = e.key.toLowerCase(), mod = e.ctrlKey || e.metaKey;
    if (k === 'delete') { cwd === 'trash' ? deleteForever() : deleteSel(); }
    else if (k === 'f2') renameSel();
    else if (mod && k === 'c') setClip('copy');
    else if (mod && k === 'x') setClip('cut');
    else if (mod && k === 'v') doPaste();
    else if (mod && k === 'a') { e.preventDefault(); sel = new Set(items().map(x => x.id)); updateSel(); }
    else if (k === 'enter' && sel.size === 1) openItem(selItems()[0]);
    else if (k === 'backspace') navigate(parentOf());
    else if (k === 'escape') { sel = new Set(); updateSel(); }
  });
  explorerRefresh = refresh; explorerGo = loc => navigate(loc); explorerCwd = () => cwd;
  refresh();
}

const order = ['files','docs','notes','calc','terminal','browser','store','paint','settings','readme','trash'];
const ICON_W = 90, ICON_H = 92, ICON_PAD = 8;
let iconPos = {};
try { iconPos = JSON.parse(store.get('los-iconpos', '{}')) || {}; } catch(e){}
const selIcons = new Set();
let deskSig = '';
function desktopFolderId(){ const d = FS.find(x => x.parent === 'root' && x.name === 'Desktop' && !x.trashed); return d ? d.id : null; }
function desktopEntries(){
  const out = [];
  order.forEach(id => out.push({key:'app:'+id, id, kind:'app', icon:apps[id].icon, label:apps[id].name, open:() => apps[id].open()}));
  pins.forEach(p => out.push({key:'pin:'+p.url, kind:'pin', pin:p, icon:p.icon, label:p.name, open:() => openSite(p.name, p.url)}));
  const df = desktopFolderId();
  if (df) kids(df).sort((a, b) => a.name.localeCompare(b.name)).forEach(it => out.push({key:'fs:'+it.id, kind:'fs', it, icon:iconOf(it), label:it.name, open:() => it.type === 'folder' ? openExplorer(it.id) : openFile(it.id)}));
  return out;
}
function markSel(){ desktop.querySelectorAll('.icon').forEach(el => el.classList.toggle('sel', selIcons.has(el.dataset.key))); }
function renameItemPrompt(it){
  promptBox('New name:', it.name, raw => {
    const name = cleanName(raw); if (!name || name === it.name) return;
    if (FS.some(x => x.parent === it.parent && !x.trashed && x.id !== it.id && x.name.toLowerCase() === name.toLowerCase())) return alertBox('That name is already used here.');
    it.name = name; saveFs(); refreshExplorer();
  });
}
function newOnDesktop(kind){
  const df = desktopFolderId(); if (!df) return alertBox('The Desktop folder is missing.');
  if (kind === 'folder') return promptBox('Folder name:', 'New folder', raw => { const n = cleanName(raw); if (!n) return; createItem(df, 'folder', n, ''); refreshExplorer(); });
  newFileDialog(df, kind, it => { refreshExplorer(); openFile(it.id); });
}
function iconMenu(e, en){
  e.preventDefault(); e.stopPropagation();
  const m = [{label:'Open', fn:en.open}];
  if (en.kind === 'pin') m.push({label:'Remove from desktop', fn:() => togglePin(en.pin.icon, en.pin.name, en.pin.url)});
  if (en.kind === 'fs') m.push('-', {label:'Rename', fn:() => renameItemPrompt(en.it)}, {label:'Delete', fn:() => { trashItems([en.it.id]); refreshExplorer(); }});
  if (en.kind === 'app' && en.id === 'trash') m.push({label:'Empty Recycle Bin', fn:emptyTrash});
  popup(e.clientX, e.clientY, m);
}
function renderDesktop(force){
  const entries = desktopEntries();
  const sig = entries.map(e => e.key + '|' + e.label + '|' + e.icon).join('~') + '|' + window.innerHeight;
  if (!force && sig === deskSig) return; deskSig = sig;
  desktop.innerHTML = '';
  const per = Math.max(1, Math.floor((deskH() - ICON_PAD) / ICON_H));
  const cell = (x, y) => Math.round((x - ICON_PAD) / ICON_W) + ',' + Math.round((y - ICON_PAD) / ICON_H);
  const used = new Set();
  entries.forEach(e => { const p = iconPos[e.key]; if (p) { e.x = Math.max(0, Math.min(p.x, deskW() - ICON_W)); e.y = Math.max(0, Math.min(p.y, deskH() - ICON_H)); used.add(cell(e.x, e.y)); } });
  let slot = 0;
  entries.forEach(e => {
    if (e.x !== undefined) return;
    for (;; slot++) {
      const x = ICON_PAD + Math.floor(slot / per) * ICON_W, y = ICON_PAD + (slot % per) * ICON_H;
      if (!used.has(cell(x, y))) { e.x = x; e.y = y; used.add(cell(x, y)); slot++; break; }
    }
  });
  entries.forEach(e => {
    const el = document.createElement('div'); el.className = 'icon'; el.dataset.key = e.key;
    if (e.kind === 'app') el.id = 'icon-' + e.id;
    el.style.left = e.x + 'px'; el.style.top = e.y + 'px';
    el.innerHTML = '<div class="glyph"></div><span class="lbl"></span>';
    el.querySelector('.glyph').textContent = e.icon; el.querySelector('.lbl').textContent = e.label; el.title = e.label;
    el.ondblclick = ev => { ev.stopPropagation(); e.open(); };
    el.onclick = ev => ev.stopPropagation();
    el.oncontextmenu = ev => { if (!selIcons.has(e.key)) { selIcons.clear(); selIcons.add(e.key); markSel(); } iconMenu(ev, e); };
    el.addEventListener('mousedown', ev => {
      if (ev.button) return; ev.stopPropagation();
      if (!selIcons.has(e.key)) { if (!(ev.ctrlKey || ev.metaKey)) selIcons.clear(); selIcons.add(e.key); markSel(); }
      const sx = ev.clientX, sy = ev.clientY, ox = el.offsetLeft, oy = el.offsetTop; let moved = false;
      const mv = m => {
        if (!moved && Math.abs(m.clientX - sx) + Math.abs(m.clientY - sy) < 5) return;
        moved = true; el.classList.add('drag'); el.style.left = (ox + m.clientX - sx) + 'px'; el.style.top = (oy + m.clientY - sy) + 'px';
      };
      const up = () => {
        document.removeEventListener('mousemove', mv); document.removeEventListener('mouseup', up);
        if (!moved) return; el.classList.remove('drag');
        let x = Math.round((el.offsetLeft - ICON_PAD) / ICON_W) * ICON_W + ICON_PAD, y = Math.round((el.offsetTop - ICON_PAD) / ICON_H) * ICON_H + ICON_PAD;
        x = Math.max(0, Math.min(x, deskW() - ICON_W)); y = Math.max(0, Math.min(y, deskH() - ICON_H));
        if ([...desktop.children].some(o => o !== el && o.offsetLeft === x && o.offsetTop === y)) { x = ox; y = oy; }
        el.style.left = x + 'px'; el.style.top = y + 'px';
        iconPos[e.key] = {x, y}; store.set('los-iconpos', JSON.stringify(iconPos));
      };
      document.addEventListener('mousemove', mv); document.addEventListener('mouseup', up);
    });
    desktop.appendChild(el);
  });
  markSel();
}
desktop.addEventListener('mousedown', e => { if (e.target === desktop) { selIcons.clear(); markSel(); } });
desktop.addEventListener('contextmenu', e => {
  if (e.target !== desktop) return; e.preventDefault();
  const mk = (label, kind) => ({label, fn:() => newOnDesktop(kind)});
  popup(e.clientX, e.clientY, [mk('New folder', 'folder'), mk('New text document', 'txt'), mk('New document', 'ldoc'), mk('New HTML file', 'html'), '-',
    {label:'Refresh', fn:() => renderDesktop(true)},
    {label:'Clean up icons', fn:() => { iconPos = {}; store.set('los-iconpos', '{}'); renderDesktop(true); }}, '-',
    {label:'Open terminal', fn:() => apps.terminal.open()}, {label:'Personalize', fn:() => apps.settings.open()}]);
});
function open(id){ apps[id].open(); }
sizeWall(); startWall(); renderDesktop(true); renderTaskbar();
</script>
</body>
